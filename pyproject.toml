[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cuvis-ai-sam3"
dynamic = ["version"]
description = "SAM3 (Segment Anything Model 3) with a cuvis.ai-compatible plugin package."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Meta AI Research" },
    { name = "Cubert GmbH, Ulm, Germany", email = "cuvis.ai@cubert-gmbh.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = [
    "cuvis",
    "hyperspectral",
    "SAM3",
    "segment-anything",
    "video-tracking",
    "computer-vision",
    "deep-learning",
    "plugin",
]
dependencies = [
    # cuvis-ai-core framework (provides torch, torchvision, numpy, Node base class, plugin system)
    # Note: cuvis-ai (node catalog) is NOT needed -- only the core framework.
    "cuvis-ai-core>=0.16.0",
    "cuvis-ai-schemas>=0.8.0",
    # SAM3-specific dependencies (not provided by cuvis-ai-core)
    "timm>=1.0.17",
    "tqdm",
    "ftfy==6.1.1",
    "regex",
    "iopath>=0.1.10",
    "typing_extensions",
    "huggingface_hub",
    "einops",
    # decord 0.6.0 ships wheels only for linux x86_64 and windows amd64 (no aarch64,
    # no macOS, no sdist). It is lazily imported by upstream video-file loaders only;
    # the plugin nodes and REST API use the cv2 loader path, so the dependency is
    # gated to the platforms that have wheels instead of failing installation
    # elsewhere (e.g. composed child environments on Jetson).
    "decord; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    # Triton is imported by sam3/model/edt.py on module import.
    "triton-windows; platform_system == 'Windows'",
    "triton; platform_system != 'Windows'",
    "psutil",
    # sam3/model_builder.py imports pkg_resources at runtime. setuptools removed
    # pkg_resources in 82.0.0, so cap at <82 to keep the pkg_resources-bearing
    # line while still satisfying the cuvis-ai launcher's setuptools>=81. The
    # PYSEC-2026-3447 fix lands only in 83.0.0, so it is ignored in CI.
    "setuptools<82",
    "opencv-python-headless>=4.13.0.92",
    "click>=8.4.2",
    "uvicorn>=0.41.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "fastapi>=0.135.1",
    "sse-starlette>=3.3.2",
    # CVE-2026-28684 fix; pulled in transitively by pydantic-settings / dotenv.
    "python-dotenv>=1.2.2",
    # CVE-2026-41066 fix; pulled in transitively.
    "lxml>=6.1.0",
    # CVE-2026-40192 + PYSEC-2026-2253..2257 / 3451..3453 fixes; pulled in transitively (torchvision et al.).
    "pillow>=12.3.0",
    # gitpython / idna / urllib3 / aiohttp security floors now live in cuvis-ai-core (>=0.7.1)
    # and are inherited transitively, so they are no longer pinned here.
    # starlette stays: it is sam3-specific (fastapi REST API), not provided by core.
    # >=1.3.1 fixes CVE-2026-54282 / CVE-2026-54283 (urlencoded form DoS, URL authority spoof).
    "starlette>=1.3.1",
]

[project.optional-dependencies]
rest = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.0",
    "pydantic-settings>=2.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "ruff",
    "mypy",
    "ipython",
    "interrogate>=1.5.0",
    # --- Release automation & security ---
    "twine>=6.2.0",
    "pip-audit>=2.7.0",
    # CVE-2026-6357 / PYSEC-2026-196 / PYSEC-2026-3721 fixes; pip-audit pulls pip into the dev env.
    "pip>=26.2",
    "bandit[toml]>=1.7.0",
    "detect-secrets>=1.4.0",
    "pip-licenses>=4.0.0",
    "cyclonedx-bom>=4.0.0",
    # --- REST API test dependencies ---
    "httpx>=0.27",
]

[project.scripts]
rest-api = "rest_api.__main__:main"

[project.urls]
Homepage = "https://www.cubert-hyperspectral.com/"
Repository = "https://github.com/cubert-hyperspectral/cuvis-ai-sam3"
Changelog = "https://github.com/cubert-hyperspectral/cuvis-ai-sam3/releases"
Issues = "https://github.com/cubert-hyperspectral/cuvis-ai-sam3/issues"

[tool.setuptools.packages.find]
include = ["sam3*", "cuvis_ai_sam3*", "rest_api*"]

[tool.setuptools.package-data]
sam3 = ["assets/*.txt.gz"]

# torch flavour in composed child environments is mirrored from the host by
# cuvis-ai-core >= 0.12.1 (see the cuvis-ai plugin-development docs); this repo
# does not pin a torch index: torch is not a direct dependency and the committed
# lock resolves it from PyPI, so an index pin here would bind nothing.
[tool.uv.sources]
# Local development alternative (uncomment to use local path instead)
# cuvis-ai-core = { path = "../../cuvis-ai-core/cuvis-ai-core-sam3", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100
# Exclude upstream SAM3 fork and Meta scripts/tests from ALL ruff processing (format + lint).
# `test` is Meta's upstream test dir (cuvis tests live in `tests`).
extend-exclude = ["sam3", "scripts", "examples", "test"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "C4",
]
extend-select = [
    "ANN201",
    "ANN202",
    "ANN204",
]
ignore = [
    "ANN401",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Ignore upstream SAM3 code -- do not lint the fork
"sam3/**" = ["ALL"]
"scripts/**" = ["ALL"]
"examples/**" = ["ALL"]
"docs/**" = [
    "ANN201",
    "ANN202",
    "ANN204",
]
"tests/**" = [
    "ANN201",
    "ANN202",
    "ANN204",
]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"

[dependency-groups]
dev = [
    "setuptools-scm>=9.2.2",
]

[tool.pytest.ini_options]
addopts = "-v -ra --showlocals --strict-markers --tb=short --color=yes"
testpaths = ["tests"]
xfail_strict = true
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
norecursedirs = ".* build dist CVS _darcs {arch} *.egg venv .venv .git .hg .bzr .tox __pycache__ node_modules sam3"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:Module already imported so cannot be rewritten",
    "ignore:.*num_workers.*:UserWarning",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests across multiple components",
    "slow: Tests that take significant time to run",
    "gpu: Tests that require GPU hardware",
]
log_cli = false
log_cli_level = "INFO"
minversion = "7.0"

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-private = false
ignore-property-decorators = false
ignore-semiprivate = false
ignore-setters = false
fail-under = 80.0
exclude = [
    "setup.py",
    "docs",
    "build",
    "tests",
    "sam3",
    "scripts",
    "examples",
    "cuvis_ai_sam3/node/sam3_segment_everything.py",
    "cuvis_ai_sam3/node/sam3_streaming_propagation.py",
]
ignore-regex = ["^get$", "^set$", "^main$"]
verbose = 2
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests", "build", "dist", "sam3", "scripts", "examples"]

# Skip upstream sam3 code when following imports
[[tool.mypy.overrides]]
module = "sam3.*"
follow_imports = "skip"

[tool.bandit]
exclude_dirs = ["tests", "sam3", "scripts", "examples"]
skips = ["B101"]  # Skip assert_used check
